{% load i18n %}
<section class="dash-hero" aria-labelledby="dash-title">
  <div>
    <p class="dash-hero__eyebrow">{% now "l, j F Y" %}</p>
    <h1 id="dash-title">{{ stats.greeting }}, {{ display_name }}</h1>
    {% if stats.user_meta %}<p class="dash-hero__sub">{{ stats.user_meta }}</p>{% endif %}
  </div>
  {% if perms.questionbank.add_question %}
  <a class="dash-btn dash-btn--primary" href="{% url 'admin:questionbank_question_generate' %}">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2Zm7 12 .9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9L19 14Z"/></svg>
    Generate questions
  </a>
  {% endif %}
</section>
